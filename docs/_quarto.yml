project:
  type: website
  output-dir: _site
  render:
    - "*.md"
    - "*.qmd"

website:
  title: "Recommended Reading"
  description: "Books, reports and papers for intelligence professionals working on illicit trade, with full citations and downloadable references."
  site-url: https://library.ab-labs.io/recommended-reading/
  repo-url: https://github.com/atlas-bear/recommended-reading
  repo-subdir: docs
  repo-actions: [issue]
  favicon: favicon.svg
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - text: Start here
        href: index.md
      - text: Browse
        href: browse.qmd
      - text: References
        href: references.qmd
    right:
      - text: Library
        href: https://library.ab-labs.io/
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - index.md
      - section: Sections
        contents:
          - financial-crime.md
          - economics-politics.md
          - geopolitics.md
          - osint.md
          - reports.md
          - wider-reading.md
      - browse.qmd
      - references.qmd
      - contributing.md
      - about.md
  page-footer:
    left: "Copyright 2024-2026 AB//LABS (formerly Atlas|Bear Labs). List and data files licensed MIT."
    right:
      - text: Library
        href: https://library.ab-labs.io/
      - text: ab-labs.io
        href: https://ab-labs.io
      - text: Contact
        href: mailto:support@ab-labs.io

format:
  atlas-bear/theme-html:
    include-after-body:
      text: '<script src="repo-stats.js" data-repo="atlas-bear/recommended-reading"></script>'
    toc-depth: 2
